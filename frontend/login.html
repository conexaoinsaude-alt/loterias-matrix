<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - LOTERIAS MATRIX</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<div class="login-container">


    <div class="login-box">


        <h1>
            LOTERIAS<br>
            MATRIX
        </h1>


        <p>
            Acesso à Plataforma
        </p>


        <form id="login-form">


            <input 
                type="email"
                id="email"
                placeholder="E-mail"
                required
            >


            <input 
                type="password"
                id="password"
                placeholder="Senha"
                required
            >


            <button type="submit">
                Entrar
            </button>


        </form>


        <div id="login-message"></div>


    </div>


</div>


<script src="login.js"></script>


</body>

</html>
